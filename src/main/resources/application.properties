# Server Port (Render supplies PORT environment variable)
server.port=${PORT:8080}

# Application Name
spring.application.name=student-performance-career-predictor

# Database Configuration (Defaults to embedded H2, seamlessly switches if DATABASE_URL or SPRING_DATASOURCE_URL is supplied)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Web Console (accessible at /h2-console for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:StudentCareerSuperSecureSecretKeyThatIsAtLeast32BytesLongForHS256Security!}
app.jwt.expiration-ms=86400000

# CORS Allowed Origins (Comma-separated origins, includes local development & wildcard vercel)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app

# Python ML Microservice URL (Fallback embedded ML engine active if unreachable)
app.ml.python-service-url=${PYTHON_ML_SERVICE_URL:http://localhost:8000}
